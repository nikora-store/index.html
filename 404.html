<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
/* Anti-flicker: apply the saved theme before first paint ('theme' key, legacy 'nikora_theme' fallback). */
(function(){
  try{
    var saved = localStorage.getItem('theme') || localStorage.getItem('nikora_theme');
    if(saved === 'light' || saved === 'dark'){ document.documentElement.setAttribute('data-theme', saved); }
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — NIKORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#FAF8F5; --card-bg:rgba(255,255,255,0.65); --card-border:rgba(230,220,210,0.6);
  --text:#1A1615; --text-soft:rgba(26,22,21,0.62); --text-faint:rgba(26,22,21,0.4);
  --gold:#C59B56; --gold-rgb:197,155,86; --line:rgba(26,22,21,0.1);
  --shadow-ambient:0 20px 60px -20px rgba(60,45,30,0.18); color-scheme:light;
}
[data-theme="dark"]{
  --canvas:#0D0B12; --card-bg:rgba(25,20,32,0.55); --card-border:rgba(255,255,255,0.08);
  --text:#F7F4F0; --text-soft:rgba(247,244,240,0.64); --text-faint:rgba(247,244,240,0.38);
  --gold:#E5BA73; --gold-rgb:229,186,115; --line:rgba(255,255,255,0.09);
  --shadow-ambient:0 20px 70px -20px rgba(0,0,0,0.6); color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:linear-gradient(-45deg,#FAF7F2,#F8F4F0,#F5EFE6,#FAF7F2);}
[data-theme="dark"] body{background:linear-gradient(-45deg,#0D0B12,#170E1B,#2A0F1D,#0D0B12);}
a{color:inherit;text-decoration:none;}
main{display:flex;justify-content:center;padding:clamp(120px,16vh,170px) clamp(20px,4vw,48px) 80px;}
.nf-card{width:100%;max-width:560px;padding:clamp(26px,5vw,44px) clamp(20px,4vw,40px);border-radius:28px;text-align:center;
  background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--shadow-ambient);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);}
.nf-code{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);}
.nf-card .nkm-empty{padding:6px 0 0;}
.nf-card .nkm-empty-title{font-size:clamp(24px,4vw,30px);}
.nf-card .nkm-empty-text{font-size:14px;max-width:38ch;}
.nf-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin-top:22px;font-size:12.5px;font-weight:600;color:var(--text-soft);}
.nf-links a{text-decoration:underline;text-underline-offset:4px;transition:color .2s ease;}
.nf-links a:hover{color:var(--gold);}
</style>
<script src="mascot.js"></script>
</head>
<body>
<script src="nav.js"></script>
<main id="top">
  <section class="nf-card" aria-label="Page not found">
    <p class="nf-code">Error 404</p>
    <div data-nk-mascot-empty data-pose="lost"
         data-title="This page wandered off"
         data-text="The link may be old or mistyped. Let's get you back to your glow ritual."
         data-cta-label="Explore Bestsellers" data-cta-href="catalog.html?filter=bestsellers"></div>
    <nav class="nf-links" aria-label="Helpful pages">
      <a href="index.html">Back to home</a>
      <a href="catalog.html">Shop all products</a>
      <a href="track-order.html">Track an order</a>
      <a href="faq.html">FAQ</a>
    </nav>
  </section>
</main>
</body>
</html>
